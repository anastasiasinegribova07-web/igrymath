<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Играем и сравниваем — математика для малышей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap&subset=cyrillic" rel="stylesheet">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(180deg,#dff3ff 0%,#fff7e6 100%);min-height:100vh;color:#2d2a4a;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
.screen{display:none;min-height:100vh}
.screen.on{display:block}
.em{display:inline-block;line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}

/* ---------- home ---------- */
.top{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#fff;box-shadow:0 4px 18px #0001;position:sticky;top:0;z-index:20}
.top h1{font-size:24px;margin:0;flex:1;line-height:1.1}
.top h1 small{display:block;font-size:13px;font-weight:600;color:#7a7896}
.pill{background:#fff4c2;border:none;border-radius:20px;padding:8px 14px;font-weight:800;font-size:17px;color:#7a5b00;display:flex;align-items:center;gap:6px}
.pill.blue{background:#e1efff;color:#1d4f9a}
.hero{display:flex;align-items:center;gap:16px;max-width:1100px;margin:18px auto 6px;padding:0 18px}
.hero .bunny{font-size:84px;animation:bob 2.4s ease-in-out infinite}
.bubble{background:#fff;border-radius:24px;padding:14px 20px;font-size:20px;font-weight:700;box-shadow:0 6px 18px #0001;position:relative}
.bubble:before{content:'';position:absolute;left:-12px;top:30px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.chips button{flex:none;border:none;border-radius:18px;padding:8px 14px;font-weight:800;font-size:15px;background:#fff;box-shadow:0 2px 8px #0001;color:#4b4870}
.topic{max-width:1100px;margin:10px auto 22px;padding:0 18px}
.topic h2{font-size:22px;margin:8px 0 10px;display:flex;align-items:center;gap:10px}
.topic h2 .tnum{background:var(--c);color:#fff;border-radius:12px;padding:2px 10px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{border:none;border-radius:22px;padding:14px 10px 12px;background:#fff;box-shadow:0 5px 0 var(--c),0 8px 18px #0001;text-align:center;transition:transform .15s;position:relative}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.card .ci{font-size:46px;height:58px;display:flex;align-items:center;justify-content:center}
.card .cn{font-weight:800;font-size:16px;margin-top:6px;line-height:1.15}
.card .cs{position:absolute;top:8px;right:10px;font-size:16px}
.foot{max-width:1100px;margin:30px auto;padding:0 18px 40px;color:#7a7896;font-size:14px;text-align:center}

/* ---------- game ---------- */
.gtop{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;box-shadow:0 4px 14px #0001;position:sticky;top:0;z-index:20}
.gbtn{width:52px;height:52px;border-radius:16px;border:none;background:#f0eefc;font-size:26px;flex:none}
.gtitle{flex:1;font-weight:800;font-size:18px;line-height:1.1;min-width:0}
.gtitle small{display:block;font-weight:700;font-size:13px;color:#8a88a6}
.road{display:flex;gap:4px;align-items:center;max-width:1000px;margin:10px auto 0;padding:0 14px;flex-wrap:wrap;justify-content:center}
.road i{width:14px;height:14px;border-radius:50%;background:#e5e3f3;display:block;font-style:normal}
.road i.d{background:#ffcc33;box-shadow:0 0 0 2px #ffe58a}
.road i.c{background:#7c6cf2;transform:scale(1.35)}
.road i.g{border-radius:4px;background:#ffd6e7}
.prompt{display:flex;align-items:center;gap:12px;max-width:1000px;margin:12px auto 6px;padding:0 14px}
.prompt .bunny{font-size:56px;flex:none}
.prompt .bubble{flex:1;font-size:22px;line-height:1.25}
.prompt .bubble:before{top:22px}
.say{width:60px;height:60px;border-radius:50%;border:none;background:#ffd84d;font-size:28px;flex:none;box-shadow:0 4px 0 #e0b400}
#stage{max-width:1000px;margin:6px auto 30px;padding:0 14px;position:relative}
.lvl{font-size:13px;font-weight:800;color:#7c6cf2;background:#efeaff;border-radius:10px;padding:2px 8px;margin-left:6px}

/* pick */
.sample{display:flex;justify-content:center;align-items:center;gap:14px;margin:6px auto 14px;background:#fff;border:4px dashed #ffb84d;border-radius:24px;padding:10px 18px;width:max-content;max-width:100%}
.sample b{font-size:18px;color:#c77700}
.opts{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center}
.opts.bottom{align-items:flex-end}
.opts.col{flex-direction:column;align-items:stretch;max-width:560px;margin:0 auto}
.opts.col .opt{justify-content:flex-start}
.opt{min-width:100px;min-height:100px;border:none;border-radius:24px;background:#fff;box-shadow:0 6px 0 #d9d5f0,0 8px 18px #0001;display:flex;align-items:center;justify-content:center;padding:12px;transition:transform .15s,box-shadow .15s;position:relative}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #d9d5f0}
.opt.word{font-size:26px;font-weight:800;padding:16px 26px;color:#3b3570;gap:10px}
.opt.done{background:#e3fbe7;box-shadow:0 6px 0 #6fd38a}
.opt.done:after{content:'✔';position:absolute;top:-10px;right:-10px;background:#22c55e;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;font-weight:900}
.scene{position:relative;width:100%;max-width:760px;margin:0 auto;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 8px 20px #0001}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.opt.abs{position:absolute;transform:translate(-50%,-50%);background:transparent;box-shadow:none;min-width:0;min-height:0;padding:6px;border-radius:50%;border:4px solid transparent}
.opt.abs:active{transform:translate(-50%,-50%) scale(.95)}
.opt.abs.done{background:#e3fbe7cc;border-color:#22c55e}
.opt.abs.hint{border-color:#ffb800}
.hint{animation:hint 1s ease-in-out infinite}
.shake{animation:shake .45s}
@keyframes hint{0%,100%{filter:drop-shadow(0 0 0 #ffb800)}50%{filter:drop-shadow(0 0 14px #ffb800)}}
@keyframes shake{0%,100%{translate:0}20%{translate:-10px}40%{translate:10px}60%{translate:-7px}80%{translate:7px}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* sort */
.pool{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:110px;background:#ffffffa0;border-radius:24px;padding:14px;margin-bottom:16px}
.sitem{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border-radius:20px;padding:8px;min-width:84px;min-height:84px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #d9d5f0;cursor:grab;transition:transform .15s}
.sitem.sel{outline:5px solid #7c6cf2;transform:scale(1.08)}
.sitem.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);box-shadow:0 12px 26px #0003}
.sitem.in{box-shadow:none;min-width:0;min-height:0;padding:2px;background:transparent;cursor:default;transform:scale(.75)}
.bins{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.bin{flex:1;min-width:150px;max-width:330px;background:var(--bc,#fff3d6);border:5px dashed var(--bb,#f0b54a);border-radius:28px;padding:10px;text-align:center;min-height:180px}
.blabel{font-size:22px;font-weight:900}
.bico{min-height:50px;display:flex;align-items:center;justify-content:center}
.bin-in{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.bin.hint{animation:hint 1s infinite;border-style:solid}

/* color */
.cwrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-start}
.cpic{background:#fff;border-radius:26px;box-shadow:0 8px 20px #0001;padding:8px;flex:1;min-width:280px;max-width:640px}
.cpic svg{width:100%;height:auto;display:block}
.csample{background:#fff;border:4px dashed #ffb84d;border-radius:20px;padding:6px;width:190px}
.csample svg{width:100%;height:auto;display:block}
.csample b{display:block;text-align:center;color:#c77700;font-size:15px}
.palette{display:flex;gap:12px;justify-content:center;margin:14px 0 0;flex-wrap:wrap}
.pen{width:70px;height:70px;border-radius:50%;border:6px solid #fff;box-shadow:0 4px 12px #0003;transition:transform .15s}
.pen.on{transform:scale(1.2);box-shadow:0 0 0 5px #2d2a4a}
.palette.hintp .pen.need{animation:hint 1s infinite}
svg .cs{cursor:pointer;transition:fill .3s}
svg .cs.blink{animation:blink 1s infinite}
@keyframes blink{50%{stroke:#ffb800;stroke-width:9}}

/* match */
.match{position:relative;display:flex;justify-content:space-between;gap:30px;max-width:640px;margin:0 auto}
.mcol{display:flex;flex-direction:column;gap:16px;z-index:2}
.mi{min-width:100px;min-height:92px;border:none;border-radius:22px;background:#fff;box-shadow:0 5px 0 #d9d5f0;display:flex;align-items:center;justify-content:center;padding:8px}
.mi.sel{outline:5px solid #7c6cf2}
.mi.done{opacity:.85;box-shadow:0 5px 0 #6fd38a}
.mlines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* memory */
.mem{display:grid;gap:12px;justify-content:center;grid-template-columns:repeat(var(--mc),minmax(80px,120px));margin:0 auto}
.mc{aspect-ratio:1;border:none;border-radius:20px;position:relative;perspective:600px;background:none;padding:0}
.mc .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mc.f .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.mc .ba{background:repeating-linear-gradient(45deg,#8f7cf7 0 12px,#a796ff 12px 24px);color:#fff;font-size:40px;box-shadow:0 5px 0 #6a58d6}
.mc .fa{background:#fff;transform:rotateY(180deg);box-shadow:0 5px 0 #d9d5f0}
.mc.ok .fa{box-shadow:0 5px 0 #6fd38a;background:#e3fbe7}

/* pop */
.pond{position:relative;height:440px;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#bfe6ff,#e9f7ff);box-shadow:inset 0 0 0 4px #fff}
.bub{position:absolute;top:100%;width:104px;height:104px;margin-left:-52px;border-radius:50%;border:3px solid #ffffffcc;background:radial-gradient(circle at 30% 30%,#fff 0 12%,#ffffff55 30%,#ffffff22 70%);display:flex;align-items:center;justify-content:center;animation:floatUp 16s linear infinite;box-shadow:inset 0 0 18px #7cc4ff}
.bub.wob{animation-play-state:paused;scale:1.1}
.bub.popped{animation:none;transition:transform .3s,opacity .3s;transform:scale(1.6);opacity:0;pointer-events:none}
.bub.glow{box-shadow:0 0 0 6px #ffb800,inset 0 0 18px #7cc4ff}
@keyframes floatUp{from{top:100%}to{top:-26%}}
.counter{text-align:center;font-size:22px;font-weight:900;margin:10px 0}

/* order */
.opool{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-end;min-height:120px;margin-bottom:16px}
.slots{display:flex;gap:10px;justify-content:center;align-items:flex-end;flex-wrap:wrap;background:#fff;border-radius:24px;padding:14px;box-shadow:0 6px 18px #0001}
.slot{min-width:90px;min-height:100px;border:4px dashed #c9c3ee;border-radius:20px;display:flex;align-items:flex-end;justify-content:center;font-size:26px;font-weight:900;color:#c9c3ee;padding:4px;position:relative}
.slot .num{position:absolute;top:2px;left:8px;font-size:16px}
.slot.full{border-style:solid;border-color:#6fd38a;color:#22c55e}
.olab{text-align:center;font-weight:800;color:#7a7896;margin:8px 0;font-size:18px}

/* place */
.zone{position:absolute;transform:translate(-50%,-50%);border:4px dashed #7c6cf2;border-radius:22px;background:#ffffff70;display:flex;align-items:center;justify-content:center;font-size:30px;color:#7c6cf2;font-weight:900}
.zone.full{border-style:solid;border-color:#22c55e;background:#e3fbe7a0}
.zone.hint{animation:hint 1s infinite;border-color:#ffb800}
.objbar{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px 0;font-weight:800;font-size:18px}

/* grid */
.gwrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start}
.gbox{background:#fff;border-radius:20px;padding:10px;box-shadow:0 6px 18px #0001;text-align:center}
.gbox b{display:block;margin-bottom:6px;color:#7a7896}
.grid{display:grid;gap:0;border:2px solid #9ec5ff}
.grid div{border:1px solid #cfe2ff;width:var(--cs);height:var(--cs);transition:background .2s}
.grid.work div{cursor:pointer}
.grid div.bad{background:#ffe1e1!important}

/* build */
.bwrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center}
.bpic{background:#fff;border-radius:26px;box-shadow:0 8px 20px #0001;padding:8px;flex:1;min-width:260px;max-width:520px}
.bpic svg{width:100%;height:auto;display:block}
.tray{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tray button{width:100px;height:100px;border:none;border-radius:22px;background:#fff;box-shadow:0 5px 0 #d9d5f0}
.tray button svg{width:70px;height:70px}

/* count */
.cnt{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-end}
.src{width:150px;height:150px;border:none;border-radius:30px;background:#fff;box-shadow:0 6px 0 #d9d5f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#7a7896;font-size:15px}
.basket{min-width:260px;max-width:440px;flex:1;min-height:200px;background:#fff3d6;border:5px solid #f0b54a;border-radius:20px 20px 60px 60px;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:4px;padding:12px}
.basket.aq{background:linear-gradient(#cdeeff,#8fd3ff);border-color:#5bb4ea;border-radius:30px}
.basket .em{cursor:pointer}
.tower{display:flex;flex-direction:column-reverse;align-items:center;min-width:120px;min-height:300px;justify-content:flex-start;background:#fff;border-radius:20px;padding:8px;box-shadow:0 6px 18px #0001}
.tower .blk{width:80px;height:38px;border-radius:8px;margin-top:3px;border:3px solid #0002}
.tower b{order:-1;margin-top:6px;color:#7a7896}
.okbtn{display:block;margin:18px auto 0;border:none;border-radius:24px;padding:16px 38px;font-size:24px;font-weight:900;color:#fff;background:#22c55e;box-shadow:0 6px 0 #15803d}

/* overlays */
.ov{position:fixed;inset:0;background:#2d2a4acc;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.box{background:#fff;border-radius:32px;padding:24px;max-width:620px;width:100%;text-align:center;max-height:92vh;overflow:auto}
.box h3{font-size:28px;margin:6px 0 12px}
.box p{font-size:18px}
.chests{display:flex;gap:16px;justify-content:center;margin:16px 0}
.chest{font-size:70px;border:none;background:#fff4c2;border-radius:26px;width:120px;height:120px;box-shadow:0 6px 0 #e0b400;animation:bob 1.8s infinite}
.chest:nth-child(2){animation-delay:.3s}.chest:nth-child(3){animation-delay:.6s}
.bigst{font-size:120px;animation:pop .6s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;margin:14px 0}
.album div{aspect-ratio:1;border-radius:18px;background:#f3f1ff;display:flex;align-items:center;justify-content:center;font-size:42px}
.album div.no{filter:grayscale(1) opacity(.18)}
.btn{border:none;border-radius:22px;padding:14px 28px;font-size:20px;font-weight:900;background:#7c6cf2;color:#fff;box-shadow:0 5px 0 #5a4bd0;margin:6px}
.btn.y{background:#ffd84d;color:#5a4500;box-shadow:0 5px 0 #e0b400}
.btn.g{background:#22c55e;box-shadow:0 5px 0 #15803d}
.fiz{font-size:110px;animation:jump .9s infinite}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
.fizn{font-size:60px;font-weight:900;color:#7c6cf2;min-height:72px}
.burst{position:fixed;pointer-events:none;z-index:90;font-size:44px;animation:fly 1.2s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
.praise{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:95;background:#fff;border-radius:30px;padding:18px 34px;font-size:34px;font-weight:900;color:#16a34a;box-shadow:0 12px 40px #0003;animation:pop .4s;pointer-events:none}
.set{display:flex;flex-direction:column;gap:12px;text-align:left;margin:10px 0}
.set label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:18px;font-weight:700;background:#f6f5ff;border-radius:16px;padding:10px 14px}
.set select,.set input{font-size:18px;font-family:inherit;transform:scale(1.2)}
.note{text-align:left;font-size:16px;line-height:1.45;color:#4b4870}
.note li{margin:4px 0}
@media (max-width:560px){
 .prompt .bubble{font-size:19px}.prompt .bunny{font-size:42px}
 .opt{min-width:86px;min-height:86px}
 .pond{height:400px}.bub{width:92px;height:92px;margin-left:-46px}
 .top h1{font-size:19px}
 .src{width:104px;height:120px}.tower{min-width:96px}.tower .blk{width:64px}.cnt{gap:10px}
}
@keyframes race{from{left:10%}to{left:86%}}
</style>
</head>
<body>
<div class="screen on" id="home">
  <div class="top">
    <h1>Играем и сравниваем<small>Математика · подготовительный класс · <span id="gcount"></span> игр</small></h1>
    <button class="pill" id="bStars">⭐ <span class="stars">0</span></button>
    <button class="pill blue" id="bAlbum">📒</button>
    <button class="pill blue" id="bAdult">👩‍🏫</button>
  </div>
  <div class="hero"><div class="bunny">🐰</div><div class="bubble">Привет! Я зайка Пуша. Выбери игру — будем играть вместе!</div></div>
  <div class="chips" id="chips"></div>
  <div id="topics"></div>
  <div class="foot">Игры по темам рабочей тетради Т.В. Алышевой «Сравниваем, считаем», часть 1. Для детей с задержкой развития и сниженной учебной мотивацией.</div>
</div>
<div class="screen" id="game">
  <div class="gtop">
    <button class="gbtn" id="bHome" aria-label="Домой">🏠</button>
    <div class="gtitle"><span id="gname"></span><small id="gsub"></small></div>
    <button class="pill">⭐ <span class="stars">0</span></button>
  </div>
  <div class="road" id="road"></div>
  <div class="prompt"><div class="bunny">🐰</div><div class="bubble" id="ptext"></div><button class="say" id="bSay" aria-label="Повторить">🔊</button></div>
  <div id="stage"></div>
</div>
<div class="ov" id="ovChest"><div class="box" id="chBody"></div></div>
<div class="ov" id="ovInfo"><div class="box" id="infoBody"></div></div>
<script>// ================= utilities =================
const $=s=>document.querySelector(s);
const R=n=>Math.floor(Math.random()*n);
const pk=a=>a[R(a.length)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pkN=(a,n)=>sh(a).slice(0,n);
const range=n=>Array.from({length:n},(_,i)=>i);
const em=(e,s=64,x='')=>`<span class="em" style="font-size:${s}px;${x}">${e}</span>`;
const cap=s=>s[0].toUpperCase()+s.slice(1);

const COL={red:'#ef4444',blue:'#3b82f6',yellow:'#facc15',green:'#22c55e',orange:'#fb923c',purple:'#a855f7',brown:'#a0612b',pink:'#f472b6',white:'#ffffff'};
const CI={red:'красным',blue:'синим',yellow:'жёлтым',green:'зелёным',orange:'оранжевым',purple:'фиолетовым',brown:'коричневым',pink:'розовым'};
const CN={red:'красный',blue:'синий',yellow:'жёлтый',green:'зелёный',orange:'оранжевый',purple:'фиолетовый',brown:'коричневый',pink:'розовый'};
const BASE4=['red','blue','yellow','green'];

// ================= settings & storage =================
const S={voice:true,sound:true,len:1,slow:false};
let ST={stars:0,stickers:[],played:{}};
function load(){try{Object.assign(S,JSON.parse(localStorage.getItem('mg_set')||'{}'));ST=Object.assign(ST,JSON.parse(localStorage.getItem('mg_st')||'{}'))}catch(e){}}
function save(){try{localStorage.setItem('mg_set',JSON.stringify(S));localStorage.setItem('mg_st',JSON.stringify(ST))}catch(e){}}

// ================= voice & sounds =================
let ruVoice=null;
function loadVoices(){try{const v=speechSynthesis.getVoices();ruVoice=v.find(x=>/^ru/i.test(x.lang)&&/female|жен|milena|irina|google/i.test(x.name))||v.find(x=>/^ru/i.test(x.lang))||null}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function say(t){if(!S.voice||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[⬅➡⬆⬇]/g,''));u.lang='ru-RU';if(ruVoice)u.voice=ruVoice;u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
let AC=null;
function tone(f,d,t=0,type='sine',v=.14){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.05)}catch(e){}}
const sfx={ok(){[523,659,784].forEach((f,i)=>tone(f,.18,i*.09))},part(){tone(740,.12,0,'sine',.1);tone(988,.14,.08,'sine',.1)},no(){tone(260,.22,0,'triangle',.12);tone(200,.25,.12,'triangle',.1)},pop(){tone(900,.07,0,'square',.05);tone(1300,.06,.04,'sine',.08)},win(){[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.2,i*.12))},flip(){tone(600,.06,0,'sine',.06)}};

const PRAISE=['Молодец!','Умница!','Отлично!','Здорово!','Так держать!','Ура, получилось!','Супер!','Правильно!','Ты справился!','Вот это да!'];
const OOPS=['Попробуй ещё раз','Посмотри внимательно','Почти! Давай ещё','Не спеши, подумай','Давай ещё разок'];
const STICKERS=['🦁','🐯','🐼','🐨','🦊','🐸','🐵','🦄','🐙','🦋','🐞','🐢','🐬','🦒','🦓','🐘','🦔','🐧','🦉','🐳','🦜','🐿️','🦩','🐝','🌈','🚀','🚂','🚁','⛵','🎈','🍉','🍓','🍦','🧁','🍭','🎠','🏰','⭐','🌻','🍄','🎸','🥁','🎨','🏆','👑','💎','🌙','☀️','🐠','🦖'];

// ================= screens =================
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
function burst(x,y,n=10,set=['⭐','✨','🌟','🎉']){for(let i=0;i<n;i++){const b=document.createElement('div');b.className='burst';b.textContent=pk(set);b.style.left=x+'px';b.style.top=y+'px';b.style.setProperty('--dx',(R(260)-130)+'px');b.style.setProperty('--dy',(R(220)-180)+'px');document.body.appendChild(b);setTimeout(()=>b.remove(),1300)}}
function praiseBox(t){const p=document.createElement('div');p.className='praise';p.textContent=t;document.body.appendChild(p);setTimeout(()=>p.remove(),1300)}
function ctr(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function shake(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}

// ================= game session =================
let cur=null;
const ENG={};
function startGame(id){
  const g=GAMES.find(x=>x.id===id);if(!g)return;
  const total=Math.max(6,Math.round((g.rounds||24)*S.len));
  document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'));
  cur={g,r:0,total,start:Date.now(),stars:0,breaks:{},last:''};
  $('#gname').innerHTML=g.icon+' '+g.name;
  show('game');renderRoad();nextRound();
}
function level(){if(!cur)return 1;const t=cur.r/cur.total;return t<1/3?1:t<2/3?2:3}
function renderRoad(){
  const n=cur.total,q=Math.round(n/4);let h='';
  for(let i=0;i<n;i++){h+=`<i class="${i<cur.r?'d':i===cur.r?'c':''}"></i>`;if((i+1)%q===0&&i<n-1)h+='<i class="g">🎁</i>'.replace('🎁','')}
  $('#road').innerHTML=h;
  const mins=Math.floor((Date.now()-cur.start)/60000);
  $('#gsub').innerHTML=`Задание ${Math.min(cur.r+1,n)} из ${n}<span class="lvl">уровень ${level()}</span>${mins?` · ${mins} мин`:''}`;
}
function setPrompt(text,voice){$('#ptext').textContent=text;cur.voice=voice||text;say(cur.voice)}
function nextRound(){
  if(!cur)return;
  if(cur.r>=cur.total)return finish();
  const q=Math.round(cur.total/4);
  if(cur.r>0&&cur.r%q===0&&!cur.breaks[cur.r]){cur.breaks[cur.r]=1;const mid=cur.r===q*2;return mid?fiz(()=>chest(nextRound)):chest(nextRound)}
  renderRoad();
  const L=level();let spec,tries=0;
  do{spec=cur.g.gen(L,cur.r);tries++}while(spec.text===cur.last&&tries<4);
  cur.last=spec.text;cur.spec=spec;cur.err=0;cur.hintFn=null;cur.lock=false;
  setPrompt(spec.text,spec.say);
  const st=$('#stage');st.innerHTML='';
  ENG[cur.g.e](spec,st,api);
}
const api={
  ok(el){if(!cur||cur.lock)return;cur.lock=true;sfx.ok();const t=pk(PRAISE);praiseBox(t);say(t);const [x,y]=el?ctr(el):[innerWidth/2,innerHeight/2];burst(x,y,14);cur.r++;cur.stars++;ST.stars++;save();updStars();setTimeout(nextRound,1700)},
  part(el){sfx.part();if(el){const[x,y]=ctr(el);burst(x,y,5,['⭐','✨'])}},
  bad(el,msg){sfx.no();shake(el);cur.err++;say(msg||pk(OOPS));if(cur.err>=2&&cur.hintFn)cur.hintFn()},
  setHint(fn){cur.hintFn=fn},
  prompt(t,v){setPrompt(t,v)},
  say
};
function updStars(){document.querySelectorAll('.stars').forEach(e=>e.textContent=ST.stars)}
function chest(cb){
  const ov=$('#ovChest');ov.classList.add('on');
  $('#chBody').innerHTML=`<h3>Ты заработал подарок!</h3><p>Выбери сундучок</p><div class="chests">${[0,1,2].map(i=>`<button class="chest" data-i="${i}">🎁</button>`).join('')}</div>`;
  say('Ты заработал подарок! Выбери сундучок.');
  $('#chBody').querySelectorAll('.chest').forEach(b=>b.onclick=()=>{
    const free=STICKERS.filter(s=>!ST.stickers.includes(s));const s=free.length?pk(free):pk(STICKERS);
    if(!ST.stickers.includes(s))ST.stickers.push(s);save();sfx.win();
    $('#chBody').innerHTML=`<h3>Наклейка в альбом!</h3><div class="bigst">${s}</div><p>Собрано наклеек: ${ST.stickers.length} из ${STICKERS.length}</p><button class="btn g" id="chGo">Играть дальше ▶</button>`;
    say('Ура! Новая наклейка в альбом!');
    $('#chGo').onclick=()=>{ov.classList.remove('on');cb()};
  });
}
const FIZ=[['🐰','Попрыгай, как зайка!','Прыгаем'],['👏','Похлопай в ладоши!','Хлопаем'],['🐻','Потопай, как мишка!','Топаем'],['🙆','Потянись высоко-высоко!','Тянемся'],['🐦','Помаши руками, как птичка крыльями!','Машем'],['🤸','Присядь и встань!','Приседаем'],['🦒','Покрути головой влево и вправо!','Крутим']];
function fiz(cb){
  const f=pk(FIZ);const ov=$('#ovChest');ov.classList.add('on');
  $('#chBody').innerHTML=`<h3>Физминутка!</h3><div class="fiz">${f[0]}</div><p style="font-size:24px;font-weight:800">${f[1]}</p><div class="fizn" id="fizn"></div><button class="btn y" id="fizGo">Начали!</button>`;
  say('Физминутка! '+f[1]+' Считаем вместе до пяти.');
  $('#fizGo').onclick=()=>{
    $('#fizGo').style.display='none';let k=0;const w=['Раз','Два','Три','Четыре','Пять'];
    const t=setInterval(()=>{$('#fizn').textContent=k+1;say(w[k]);tone(500+k*80,.15);k++;if(k>=5){clearInterval(t);setTimeout(()=>{$('#fizn').textContent='Молодец! 💪';say('Молодец! Отдохнули, теперь играем дальше.');setTimeout(()=>{ov.classList.remove('on');cb()},2200)},900)}},1500);
  };
}
function finish(){
  const g=cur.g;ST.played[g.id]=(ST.played[g.id]||0)+1;
  const free=STICKERS.filter(s=>!ST.stickers.includes(s));const s=free.length?pk(free):pk(STICKERS);if(!ST.stickers.includes(s))ST.stickers.push(s);save();
  const mins=Math.max(1,Math.round((Date.now()-cur.start)/60000));
  sfx.win();
  $('#ovChest').classList.add('on');
  $('#chBody').innerHTML=`<h3>🏆 Игра пройдена!</h3><div class="bigst">${s}</div><p>Ты выполнил ${cur.total} заданий и получил ${cur.stars} ⭐<br>Время игры: ${mins} мин.</p><button class="btn g" id="fAgain">Ещё раз</button><button class="btn" id="fHome">К играм</button>`;
  say('Ура! Игра пройдена! Ты большой молодец!');
  burst(innerWidth/2,innerHeight/2,24,['🎉','⭐','🎈','🏆','✨']);
  $('#fAgain').onclick=()=>{$('#ovChest').classList.remove('on');startGame(g.id)};
  $('#fHome').onclick=()=>{$('#ovChest').classList.remove('on');goHome()};
  cur=null;
}
function goHome(){cur=null;document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'));try{speechSynthesis.cancel()}catch(e){}renderHome();show('home')}

// ================= SVG helpers =================
function polyTri(s){const{x,y,w,h}=s;const d=s.dir||'up';const P={up:[[x+w/2,y],[x+w,y+h],[x,y+h]],down:[[x,y],[x+w,y],[x+w/2,y+h]],left:[[x,y+h/2],[x+w,y],[x+w,y+h]],right:[[x,y],[x+w,y+h/2],[x,y+h]]}[d];return P.map(p=>p.join(',')).join(' ')}
function shp(s,fill,extra=''){
  const st=`fill="${fill}" stroke="${s.stroke||'#3b3b58'}" stroke-width="${s.sw||4}" stroke-linejoin="round" ${s.dash?'stroke-dasharray="10 8"':''} ${extra}`;
  switch(s.k){
    case'circle':return`<circle cx="${s.x}" cy="${s.y}" r="${s.r}" ${st}/>`;
    case'square':case'rect':return`<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="${s.rx??5}" ${st}/>`;
    case'tri':return`<polygon points="${polyTri(s)}" ${st}/>`;
    case'ell':return`<ellipse cx="${s.x}" cy="${s.y}" rx="${s.rx}" ry="${s.ry}" ${st}/>`;
    case'poly':return`<polygon points="${s.pts}" ${st}/>`;
    case'path':return`<path d="${s.d}" ${st}/>`;
  }
}
function svg(w,h,inner,attr=''){return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%;height:auto;overflow:visible" ${attr}>${inner}</svg>`}
function shapeIcon(k,c,size=80){
  const m={circle:{k:'circle',x:40,y:40,r:32},square:{k:'square',x:9,y:9,w:62,h:62},tri:{k:'tri',x:6,y:8,w:68,h:62},rect:{k:'rect',x:2,y:20,w:76,h:40}}[k];
  return svg(size,size,`<g transform="scale(${size/80})">${shp(m,COL[c]||c)}</g>`);
}

// ================= ENGINES =================
// ---- pick: tap the right one(s)
ENG.pick=(s,el,api)=>{
  const it=s.items;const need=it.filter(i=>i.ok).length;let got=0;let h='';
  if(s.top)h+=`<div class="sample">${s.top}</div>`;
  if(s.layout==='abs')h+=`<div class="scene" style="height:${s.h||360}px">${s.scene||''}${it.map((o,i)=>`<button class="opt abs" data-i="${i}" style="left:${o.x}%;top:${o.y}%;${o.st||''}">${o.h}</button>`).join('')}</div>`;
  else h+=`<div class="opts ${s.cls||''}">${it.map((o,i)=>`<button class="opt ${s.word?'word':''}" data-i="${i}">${o.h}</button>`).join('')}</div>`;
  el.innerHTML=h;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('done')||cur.lock)return;const o=it[b.dataset.i];
    if(o.ok){b.classList.add('done');b.classList.remove('hint');got++;if(got>=need)api.ok(b);else api.part(b)}
    else api.bad(b,o.msg);
  });
  api.setHint(()=>el.querySelectorAll('.opt').forEach(b=>{if(it[b.dataset.i].ok&&!b.classList.contains('done'))b.classList.add('hint')}));
};

// ---- sort: put items into bins (drag or tap)
ENG.sort=(s,el,api)=>{
  const items=sh(s.items.map((o,i)=>({...o,i})));
  el.innerHTML=`<div class="pool">${items.map(o=>`<div class="sitem" data-i="${o.i}">${o.h}</div>`).join('')}</div><div class="bins">${s.bins.map((b,i)=>`<div class="bin" data-b="${i}" style="--bc:${b.bg||'#fff3d6'};--bb:${b.bd||'#f0b54a'}"><div class="blabel">${b.label}</div><div class="bico">${b.h||''}</div><div class="bin-in"></div></div>`).join('')}</div>`;
  const bins=[...el.querySelectorAll('.bin')];let sel=null,left=items.length;const errs={};
  function select(d){if(sel)sel.classList.remove('sel');sel=d;d.classList.add('sel');sfx.flip()}
  function drop(d,binEl){
    const o=s.items[d.dataset.i];const b=+binEl.dataset.b;bins.forEach(x=>x.classList.remove('hint'));
    if(o.bin===b){d.classList.remove('sel');d.classList.add('in');binEl.querySelector('.bin-in').appendChild(d);sel=null;left--;if(!left)api.ok(binEl);else api.part(binEl)}
    else{errs[d.dataset.i]=(errs[d.dataset.i]||0)+1;api.bad(d,s.wrong||'Это не сюда. Подумай ещё');if(errs[d.dataset.i]>=2)bins[o.bin].classList.add('hint')}
  }
  el.querySelectorAll('.sitem').forEach(d=>{
    d.addEventListener('pointerdown',e=>{
      if(d.classList.contains('in')||cur.lock)return;e.preventDefault();
      const sx=e.clientX,sy=e.clientY;let ghost=null;
      const mv=ev=>{if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>12){ghost=d.cloneNode(true);ghost.className='sitem ghost';document.body.appendChild(ghost);d.style.opacity=.3}
        if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px'}};
      const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
        if(ghost){ghost.remove();d.style.opacity='';const t=document.elementFromPoint(ev.clientX,ev.clientY);const bn=t&&t.closest('.bin');if(bn)drop(d,bn)}else select(d)};
      window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
    });
  });
  bins.forEach(b=>b.addEventListener('click',()=>{if(sel)drop(sel,b);else if(!cur.lock){say('Сначала нажми на картинку');const f=el.querySelector('.sitem:not(.in)');shake(f)}}));
  api.setHint(()=>{const d=sel||el.querySelector('.sitem:not(.in)');if(!d)return;select(d);bins[s.items[d.dataset.i].bin].classList.add('hint')});
};

// ---- color: choose pencil, tap shapes
ENG.color=(s,el,api)=>{
  const pal=s.palette||BASE4;let selC=null;const sh_=s.shapes;let left=sh_.filter(x=>x.need).length;
  const pic=svg(s.w,s.h,(s.deco||'')+sh_.map((x,i)=>shp(x,'#fff',`class="cs" data-i="${i}"`)).join('')+(s.decoTop||''));
  let samp='';
  if(s.sample)samp=`<div class="csample"><b>Образец</b>${svg(s.w,s.h,(s.deco||'')+sh_.map(x=>shp(x,x.need?COL[x.need]:'#fff')).join('')+(s.decoTop||''))}</div>`;
  el.innerHTML=`<div class="cwrap">${samp}<div class="cpic">${pic}</div></div><div class="palette">${pal.map(c=>`<button class="pen" data-c="${c}" style="background:${COL[c]}" aria-label="${CN[c]}"></button>`).join('')}</div>`;
  const pens=[...el.querySelectorAll('.pen')];
  pens.forEach(p=>p.onclick=()=>{pens.forEach(x=>x.classList.remove('on'));p.classList.add('on');selC=p.dataset.c;sfx.flip();say(CN[selC]+' карандаш')});
  el.querySelectorAll('.cs').forEach(n=>n.addEventListener('click',()=>{
    if(cur.lock)return;const x=sh_[n.dataset.i];
    if(n.dataset.done)return;
    if(!selC){say('Сначала выбери карандаш');el.querySelector('.palette').classList.add('hintp');pens.forEach(p=>p.classList.add('need'));setTimeout(()=>{pens.forEach(p=>p.classList.remove('need'))},2500);return}
    if(!x.need){api.bad(null,x.msg||'Эту фигуру раскрашивать не нужно');return}
    if(x.need!==selC){api.bad(null,'Нужен другой цвет. Послушай ещё раз');return}
    n.setAttribute('fill',COL[selC]);n.dataset.done=1;n.classList.remove('blink');left--;
    const r=n.getBoundingClientRect();if(!left)api.ok(n);else{sfx.part();burst(r.left+r.width/2,r.top+r.height/2,5,['✨','⭐'])}
  }));
  api.setHint(()=>{const i=sh_.findIndex((x,i)=>x.need&&!el.querySelector(`.cs[data-i="${i}"]`).dataset.done);if(i<0)return;el.querySelector(`.cs[data-i="${i}"]`).classList.add('blink');el.querySelector('.palette').classList.add('hintp');pens.forEach(p=>p.classList.toggle('need',p.dataset.c===sh_[i].need))});
};

// ---- match: connect pairs with lines
ENG.match=(s,el,api)=>{
  const n=s.pairs.length;const L=sh(range(n)),Rr=sh(range(n));
  el.innerHTML=`<div class="match"><svg class="mlines"></svg><div class="mcol">${L.map(i=>`<button class="mi" data-s="L" data-p="${i}">${s.pairs[i][0]}</button>`).join('')}</div><div class="mcol">${Rr.map(i=>`<button class="mi" data-s="R" data-p="${i}">${s.pairs[i][1]}</button>`).join('')}</div></div>`;
  const box=el.querySelector('.match'),lines=el.querySelector('.mlines');let sel=null;const done=[];const LC=['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7','#ec4899'];
  function draw(){const b=box.getBoundingClientRect();lines.innerHTML=done.map(([a,c],k)=>{const ra=a.getBoundingClientRect(),rc=c.getBoundingClientRect();return`<line x1="${ra.right-b.left}" y1="${ra.top+ra.height/2-b.top}" x2="${rc.left-b.left}" y2="${rc.top+rc.height/2-b.top}" stroke="${LC[k%6]}" stroke-width="7" stroke-linecap="round"/>`}).join('')}
  window.addEventListener('resize',draw);
  el.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('done')||cur.lock)return;
    if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');sfx.flip();return}
    if(sel.dataset.p===b.dataset.p){const a=sel.dataset.s==='L'?sel:b,c=sel.dataset.s==='L'?b:sel;a.classList.add('done');c.classList.add('done');a.classList.remove('sel','hint');c.classList.remove('sel','hint');done.push([a,c]);draw();sel=null;if(done.length===n)api.ok(c);else api.part(c)}
    else{api.bad(b,s.wrong);sel.classList.remove('sel');sel=null}
  });
  api.setHint(()=>{const a=sel||el.querySelector('.mi:not(.done)');if(!a)return;el.querySelectorAll(`.mi[data-p="${a.dataset.p}"]`).forEach(x=>x.classList.add('hint'))});
};

// ---- memory: find pairs
ENG.memory=(s,el,api)=>{
  const cards=sh([...s.faces,...s.faces].map((f,i)=>({f,k:s.faces.indexOf(f)})));
  const cols=cards.length<=6?3:cards.length<=8?4:cards.length<=12?4:5;
  el.innerHTML=`<div class="mem" style="--mc:${cols}">${cards.map((c,i)=>`<button class="mc" data-i="${i}"><div class="in"><div class="ba">?</div><div class="fa">${c.f}</div></div></button>`).join('')}</div>`;
  const B=[...el.querySelectorAll('.mc')];let open=[],lock=false,found=0,miss=0;
  B.forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('f')||cur.lock)return;b.classList.add('f');sfx.flip();open.push(b);
    if(open.length===2){const[a,c]=open;open=[];
      if(cards[a.dataset.i].k===cards[c.dataset.i].k){a.classList.add('ok');c.classList.add('ok');found++;if(found===s.faces.length)api.ok(c);else api.part(c)}
      else{lock=true;miss++;setTimeout(()=>{a.classList.remove('f');c.classList.remove('f');lock=false;
        if(miss%4===0){say('Подсказка! Смотри внимательно');lock=true;B.forEach(x=>x.classList.add('f'));setTimeout(()=>{B.forEach(x=>{if(!x.classList.contains('ok'))x.classList.remove('f')});lock=false},1600)}},1000)}
    }
  });
};

// ---- pop: floating bubbles, tap the right ones
ENG.pop=(s,el,api)=>{
  const need=s.items.filter(i=>i.ok).length;let got=0;
  el.innerHTML=`<div class="counter">Найдено: <span id="pc">0</span> из ${need}</div><div class="pond"></div>`;
  const pond=el.querySelector('.pond');const items=sh(s.items);const cols=Math.min(5,items.length);

const PIX={heart:[[1,0],[3,0],[0,1],[1,1],[2,1],[3,1],[4,1],[0,2],[1,2],[2,2],[3,2],[4,2],[1,3],[2,3],[3,3],[2,4]],

// ================= home / album / adult =================
function renderHome(){
  updStars();
  $('#chips').innerHTML=TOPICS.map(t=>`<button data-t="${t.id}" style="color:${t.c}">${t.icon} ${t.name}</button>`).join('');
  $('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{const el=document.getElementById('topic-'+b.dataset.t);if(el)window.scrollTo({top:el.offsetTop-80,behavior:'smooth'})});
  $('#topics').innerHTML=TOPICS.map((t,i)=>`<section class="topic" id="topic-${t.id}" style="--c:${t.c}"><h2><span class="tnum">${i+1}</span>${t.icon} ${t.name}</h2><div class="cards">${GAMES.filter(g=>g.t===t.id).map(g=>`<button class="card" data-g="${g.id}">${ST.played[g.id]?'<span class="cs">🏆</span>':''}<div class="ci">${g.icon}</div><div class="cn">${g.name}</div></button>`).join('')}</div></section>`).join('');
  $('#topics').querySelectorAll('.card').forEach(b=>b.onclick=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}startGame(b.dataset.g)});
  $('#gcount').textContent=GAMES.length;
}
function openAlbum(){
  $('#ovInfo').classList.add('on');
  $('#infoBody').innerHTML=`<h3>📒 Мой альбом наклеек</h3><p>Собрано: ${ST.stickers.length} из ${STICKERS.length}. Проходи игры — получай наклейки!</p><div class="album">${STICKERS.map(s=>`<div class="${ST.stickers.includes(s)?'':'no'}">${s}</div>`).join('')}</div><button class="btn" onclick="$('#ovInfo').classList.remove('on')">Закрыть</button>`;
}
function openAdult(){
  $('#ovInfo').classList.add('on');
  $('#infoBody').innerHTML=`<h3>👩‍🏫 Для взрослого</h3>
  <div class="set">
   <label>Озвучка заданий <input type="checkbox" id="sVoice" ${S.voice?'checked':''}></label>
   <label>Звуки <input type="checkbox" id="sSound" ${S.sound?'checked':''}></label>
   <label>Медленные шарики <input type="checkbox" id="sSlow" ${S.slow?'checked':''}></label>
   <label>Длина игры <select id="sLen"><option value="0.5">Короткая (~8 мин)</option><option value="1">Обычная (~15 мин)</option><option value="1.5">Длинная (~25 мин)</option></select></label>
  </div>
  <div class="note"><b>Как устроены игры</b><ul>
   <li>Игры идут по темам рабочей тетради Т.В. Алышевой «Сравниваем, считаем» (подготовительный класс, часть 1).</li>
   <li>В обычной игре 24 задания на 3 уровня: сначала выбор из двух картинок, потом из трёх-четырёх, в конце — задания в два шага. Получается около 15 минут.</li>
   <li>Каждое задание озвучивается. Кнопка 🔊 повторяет его ещё раз.</li>
   <li>Ошибка не наказывается. После двух ошибок появляется подсказка: нужный ответ начинает светиться.</li>
   <li>После каждой четверти игры ребёнок открывает сундучок и получает наклейку в альбом, а в середине игры есть физминутка.</li>
   <li>Если ребёнок устал, нажмите 🏠 — игру можно начать заново в любой момент.</li>
   <li>Голос зависит от устройства. Если озвучки нет, проверьте, что в системе установлен русский голос.</li>
  </ul></div>
  <button class="btn" id="sClose">Сохранить</button>`;
  $('#sLen').value=String(S.len);
  $('#sClose').onclick=()=>{S.voice=$('#sVoice').checked;S.sound=$('#sSound').checked;S.slow=$('#sSlow').checked;S.len=+$('#sLen').value;save();$('#ovInfo').classList.remove('on')};
}
load();
document.addEventListener('DOMContentLoaded',()=>{
  renderHome();
  $('#bHome').onclick=goHome;
  $('#bSay').onclick=()=>{if(cur)say(cur.voice)};
  $('#bAlbum').onclick=openAlbum;$('#bAdult').onclick=openAdult;$('#bStars').onclick=openAlbum;
});
